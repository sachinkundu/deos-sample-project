<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple calculator for four basic operations." />
    <title>Simple calculator</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator" aria-labelledby="calculator-title">
        <header class="calculator__header">
          <p class="eyebrow">Everyday arithmetic</p>
          <h1 id="calculator-title">Simple calculator</h1>
          <p class="hint">Use the buttons or your keyboard.</p>
        </header>

        <div class="display-panel">
          <p id="calculation" class="calculation" hidden></p>
          <output id="display" class="display" aria-live="polite" aria-atomic="true">0</output>
        </div>

        <div class="keypad" aria-label="Calculator controls">
          <button type="button" class="key key--clear" data-action="clear" data-value="C" aria-label="Clear">Clear</button>
          <button type="button" class="key key--operator" data-action="select_operator" data-value="/" aria-label="Divide">÷</button>

          <button type="button" class="key" data-action="append_digit" data-value="7">7</button>
          <button type="button" class="key" data-action="append_digit" data-value="8">8</button>
          <button type="button" class="key" data-action="append_digit" data-value="9">9</button>
          <button type="button" class="key key--operator" data-action="select_operator" data-value="*" aria-label="Multiply">×</button>

          <button type="button" class="key" data-action="append_digit" data-value="4">4</button>
          <button type="button" class="key" data-action="append_digit" data-value="5">5</button>
          <button type="button" class="key" data-action="append_digit" data-value="6">6</button>
          <button type="button" class="key key--operator" data-action="select_operator" data-value="-" aria-label="Subtract">−</button>

          <button type="button" class="key" data-action="append_digit" data-value="1">1</button>
          <button type="button" class="key" data-action="append_digit" data-value="2">2</button>
          <button type="button" class="key" data-action="append_digit" data-value="3">3</button>
          <button type="button" class="key key--operator" data-action="select_operator" data-value="+" aria-label="Add">+</button>

          <button type="button" class="key key--zero" data-action="append_digit" data-value="0">0</button>
          <button type="button" class="key" data-action="append_decimal" data-value="." aria-label="Decimal point">.</button>
          <button type="button" class="key key--equals" data-action="calculate" data-value="=" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
